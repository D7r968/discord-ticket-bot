name: Keep bot awake

# Render Free يرقد بعد 15 دقيقة بدون زيارة — نبعته كل 5 دقائق
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bot health endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://discord-ticket-bot-v2-3uzx.onrender.com/

# تفعيل الجدولة بعد تحديث التوكن
